version: '3.8'
 
services:
  db:
    image: postgres:latest
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: IT2_new_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nestjs-app
    restart: always
    depends_on:
      - db
    ports:
      - "5000:4000"
    env_file:
      - .env
    environment:
      PG_DB_URL: postgresql://postgres:1234@db:5432/IT2_new_db?schema=public&connection_limit=10
 
volumes:
  pgdata: