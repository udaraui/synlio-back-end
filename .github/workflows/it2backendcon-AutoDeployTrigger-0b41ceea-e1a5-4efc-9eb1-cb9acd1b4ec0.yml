name: Trigger auto deployment for it2backendcon

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/it2backendcon-AutoDeployTrigger-0b41ceea-e1a5-4efc-9eb1-cb9acd1b4ec0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.IT2BACKENDCON_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IT2BACKENDCON_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IT2BACKENDCON_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        # with:
        #   appSourcePath: ${{ github.workspace }}
        #   _dockerfilePathKey_: _dockerfilePath_
        #   _targetLabelKey_: _targetLabel_
        #   registryUrl: it2backendreg-dghgdrhqcdf7apam.azurecr.io
        #   registryUsername: ${{ secrets.IT2BACKENDCON_REGISTRY_USERNAME }}
        #   registryPassword: ${{ secrets.IT2BACKENDCON_REGISTRY_PASSWORD }}
        #   containerAppName: it2backendcon
        #   resourceGroup: it2
        #   imageToBuild: it2backendreg-dghgdrhqcdf7apam.azurecr.io/it2backendcon:${{ github.sha }}
        #   _buildArgumentsKey_: |
        #     _buildArgumentsValues_
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ secrets.IT2BACKENDCON_REGISTRY_URL }}
          registryUsername: ${{ secrets.IT2BACKENDCON_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.IT2BACKENDCON_REGISTRY_PASSWORD }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToBuild: ${{ secrets.IT2BACKENDCON_REGISTRY_URL }}/${{ secrets.CONTAINER_APP_NAME }}:${{ github.sha }}


